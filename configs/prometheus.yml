global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'dynatrace-demo'
    environment: 'demo'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  - job_name: 'app1-jd-ns1'
    static_configs:
      - targets: ['app1-jd-ns1:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: app
        replacement: 'app1-jd'
      - target_label: namespace
        replacement: 'ns1'

  - job_name: 'app1-jd-ns2'
    static_configs:
      - targets: ['app1-jd-ns2:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: app
        replacement: 'app1-jd'
      - target_label: namespace
        replacement: 'ns2'

  - job_name: 'app2-md-ns1'
    static_configs:
      - targets: ['app2-md-ns1:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: app
        replacement: 'app2-md'
      - target_label: namespace
        replacement: 'ns1'

  - job_name: 'app2-md-ns2'
    static_configs:
      - targets: ['app2-md-ns2:8080']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: app
        replacement: 'app2-md'
      - target_label: namespace
        replacement: 'ns2'