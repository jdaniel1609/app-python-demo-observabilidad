receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s
  resource:
    attributes:
      - key: deployment.environment
        value: "demo"
        action: upsert

exporters:
  logging:
    loglevel: info

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging]
    metrics:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging]
    logs:
      receivers: [otlp]
      processors: [batch, resource]
      exporters: [logging]